name: Deploy Backend (EC2 + Docker Compose)

on:
  push:
    branches: [develop]
    paths:
      - 'server/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }} # elastic IP de la instancia
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }} # contenido de la .pem
          script: |
            set -e
            cd ~/2026-1c-backend-grupo-06
            git pull origin develop
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
