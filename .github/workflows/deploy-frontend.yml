name: Deploy Frontend (S3 + CloudFront)

# Se dispara solo cuando cambian archivos del cliente
on:
  push:
    branches: [develop]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        # La API es mismo origen que el front (CloudFront /api/* -> EC2),
        # asi que la URL es relativa. No hace falta secret.
        # CI=false evita que CRA trate los warnings de ESLint como errores
        # (en CI, GitHub setea CI=true y el build fallaria por los warnings).
        env:
          REACT_APP_API_URL: /api
          CI: 'false'
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync build to S3
        run: aws s3 sync build/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DIST_ID }} \
            --paths "/*"
